spring:
  application:
    name: chain-watcher

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cryptopayment}
    username: ${DB_USERNAME:cryptopayment_chain_watcher}
    password: ${DB_PASSWORD:chain_watcher}

  flyway:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cryptopayment}
    user: ${DB_MIGRATOR_USERNAME:cryptopayment_chain_watcher_migrator}
    password: ${DB_MIGRATOR_PASSWORD:chain_watcher_migrator}
    schemas: chain_watcher_migrations
    create-schemas: false

server:
  port: 8081

# Actuator listens on a port of its own, so that it is never routed to the outside world.
management:
  server:
    port: 9081
  endpoints:
    web:
      exposure:
        include: health,info
