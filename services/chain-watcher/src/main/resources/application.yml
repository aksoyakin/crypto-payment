spring:
  application:
    name: chain-watcher

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cryptopayment}
    username: ${DB_USERNAME:cryptopayment_chain_watcher}
    password: ${DB_PASSWORD:chain_watcher}

  flyway:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cryptopayment}
    user: ${DB_MIGRATOR_USERNAME:cryptopayment_chain_watcher_migrator}
    password: ${DB_MIGRATOR_PASSWORD:chain_watcher_migrator}
    schemas: chain_watcher_migrations
    create-schemas: false

cryptopayment:
  watcher:
    # One cycle per block time keeps the cursor within a block of the head.
    poll-interval: 2s
    block-window: 50
    block-history: 128
    rpc:
      connect-timeout: 2s
      read-timeout: 10s
      attempts-per-endpoint: 3
      backoff: 250ms
    chains:
      - id: ${CHAIN_ID:anvil-local}
        # More than one endpoint may be given; they are tried in order.
        rpc-urls: ${CHAIN_RPC_URLS:http://localhost:8545}

server:
  port: 8081

# Actuator listens on a port of its own, so that it is never routed to the outside world.
management:
  server:
    port: 9081
  endpoints:
    web:
      exposure:
        include: health,info
